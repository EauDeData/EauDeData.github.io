<script>const D={"text": {"1": {"name": "Rei i reina", "phases": [{"title": "FASE 1 · REI I REINA", "q": ["«Es la primera vez que me he fijado en el material. Y me parece que es como basalto»", "«Yo el palo, y por culpa del palo me he quedado todo el rato en el de la derecha.»", "«Me he estado mirando todo el rato como lo desgastado que está, si es a propósito o no es a propósito, si es el paso del tiempo»", "«Si la mierdecilla que cae viene de algo, si es del agua»", "«Es una representación de la mierda del rey va cayendo hacia abajo»", "«Tiene el falo arriba»", "«Yo me he ido fijando en, por ejemplo, los cortes… la cintura de cómo está hecha. Realmente es un corte.»", "«Sí que hay cortes por los laterales»", "«Este tiene un palo, pero claro, el otro no, y me pregunto si eso también tendrá un significado más allá.»", "«Que solo ella tiene una corona y el rey no»", "«Para mí también es más macha la de la izquierda que la de la derecha.»"]}, {"title": "FASE 1 · APRECIACIONS 2", "q": ["«Per l'exterior és llis, o hi ha un intent de ser llis… però per dins és com les estries»", "«L'interior és com estriat i l'exterior és com llis»", "«Las partes que no están enfrentadas parecen más irregulares»", "«Yo creo que todo está hecho más o menos a conciencia»", "«Yo creo que es hormigón»", "«Yo creo que es más basalto»", "«La capa lisa está lijada»", "«Tiene excrementos en la parte superior»", "«Gracias al palito ese hacen que tenga la misma altura.»", "«Si damos por hecho que el de la derecha es el rey y tiene una corona, parece que con la corona intenta llegar a la misma altura que la reina.»", "«El de la izquierda me parecía como más macho»", "«Tiene como la cabeza más grande y parece como más dominante, ¿no? Está como un poco como casi inclinándose encima de la otra.»", "«Y la otra se está acercando para dar un piquito.»", "«La cabeza del de la izquierda… Está como más inclinada hacia abajo, como mirando hacia abajo.»", "«Hasta qué punto el palo de la derecha no se está como clavando y hundiéndola a ella.»", "«Todos estamos de acuerdo en que las esculturas están mirando, ¿no?»", "«No había dado por hecho que era una cara y yo pensaba que era el pelo.»", "«Las bases, una es más baja que la otra. Yo creo que es porque el terreno es irregular»", "«Las bases están más o menos a la misma altura, pero luego las estructuras no son iguales»", "«Yo creo que es madera pero no creo que sea madera»", "«Yo creo que no es madera porque no aguanta»", "«El hormigón armado sí, tiene varillas de acero.»", "«Yo creo que esas no son varillas de hormigón armado al uso.»", "«Es irregular, muy irregular. Y tiene afectación por el exterior.»", "«Se ve muy deteriorada por el exterior.»"]}, {"title": "FASE 2 · VISTA DES DEL PUNT B", "q": ["«Estamos asumiendo el género de dos piedras.»", "«Desde esta perspectiva, noto como la de la izquierda es súper poco estable.»", "«Por culpa del agujero que ve ahí abajo me da la sensación de que en cualquier momento ahora se caerá.»", "«Antes era como una cosa más cilíndrica, circular, y ahora casi parece una cosa como casi convexa»", "«No es realmente un prisma o un cilindro, sino que es otra figura como convexa por un lado y cóncava por el otro»", "«La parte esta de que el interior era más rugoso que el exterior, ahora se ve súper claro»", "«Se ve muy claro el interior rugoso de esta y el plano y el corte ese»", "«Las rayitas esas abajo»", "«La que lleva la corona, pues tiene como cortes… son más pequeños… sin embargo, aquí hay uno grande.»", "«Hay una faceta solo casi.»", "«Aquí parece casi irregular el de más a la derecha… por de abajo es más irregular»", "«Y el palo se ha convertido en corona»", "«Yo los veo que están un poco más separados»", "«Pero como que se encajan. Como si lo hubiesen partido. Hecho como un puzzle»", "«Yo creo que ya es evidente que es piedra»", "«Miren los líquenes ahí arriba»", "«La piedra de la derecha… la parte de abajo como que acaba como si fuese un vestido, una falda»", "«Lo de abajo también puede ser como una especie de bordados en la capa del rey»", "«Y ahora tengo más sensación de cariño»", "«En esta perspectiva veo… más como acercándose»", "«Menos agresivo, ¿no?»", "«Se genera más como una casita desde aquí, ¿no?»", "«Está más recogido»", "«Desde el otro lado sí que parece como un poco más frío»"]}, {"title": "FASE 3 · ENTORN", "q": ["«Aquí hi ha ombra o sol segons l'hora del dia.»", "«L'edifici fa que sigui més lluminosa, que brilli»", "«És una zona de pas, aleshores potser això ha fet també una mica que t'agradi més la pedra.»", "«Estem a un lloc que no és l'esperat per l'hora de l'obra.»", "«Hagi triat un ambient que literalment li caigui de tot.»", "«Si plou el barro, li caigui el barro. Si hi ha un pàjaro a sobre…»", "«Esa parte creo que también es intencional, como la parte de que no hayan escogido un lugar en donde se tape sino como que también se degrade»", "«Eso podría ir, si pensamos un poco más allá, tipo en las relaciones humanas al paso del tiempo»", "«Dado que es como una relación que sabemos que son el rey y la reina, pues yo también como que he pensado también en esa relación»", "«Quizás hemos dudado mucho si era hormigón y quizás hay un juego también con el hormigón del edificio de la facultad de traducción y las columnas de la biblioteca»", "«Segurament l'il·lumina perquè aquest és un entorn d'il·luminació.»", "«Si tu la veuries des d'aquella zona de pas, tens la llum darrere, no? I reflecteix.»", "«És com una catedral, no té la llum darrere.»", "«La varietat de pensaments… a l'estat d'una universitat saps que passa molta gent»", "«Si pasas con los colegas, si no aprecian en absoluto el arte… dices este truño quién lo ha plantado aquí»", "«No es como la idea clásica que te encontrarías en un museo, es como algo más experimental»", "«En el fondo tienes unos murales… es un mural con muchos colores, muchas formas, es muy figurativo… y después ves dos piedras y no entiendes ningún contexto»", "«Tú lo veías en realidad más o menos proyectado contra el naranja este de este edificio»"]}]}, "2": {"name": "Porta", "phases": [{"title": "FASE 1 · 15 S (VISTA INICIAL)", "q": ["«Una pérgola, ¿eh?»", "«Me parece como una puerta, como un portal.»", "«Yo la verdad es que no he pensado en qué me parece, sino en las formas.»", "«Lo veo como todo en líneas rectas, menos una curva y espirales»", "«Es que es todo torcido.»", "«Hay esas dos barras en teoría paralelas. Creo que son una sola»", "«Las volutas son típicas del cabezal corintio»", "«Está muy oxidado»", "«Es como algo muy viejo, desgastado y destruido.»", "«No sé si habéis visto Coraline… Es como de niños de terror»", "«Es como literalmente el jardín de la familia primera que está destruido, en plan está sucio y mal. Es como que siento que estaría allí, esta pieza.»", "«A mí me recuerda como a Alicia en el País de las Maravillas. Es como una puerta que no lleva a nada, pero a la vez es como la división entre un lado y el otro.»", "«El triángulo no podría ser Cataluña, el triángulo que se genera en la parte izquierda»", "«Siempre que representamos Cataluña se hace en forma de triángulo»", "«A la derecha es todo línea recta y a la izquierda es donde están las curvas.»"]}, {"title": "FASE 1 · 2 MINUTS", "q": ["«Yo creo que es acero. Hay un acero que se escoge para que se oscure, que se llama acero corten»", "«Yo no he pensado tanto en los materiales, sino más que todo como en la forma.»", "«Algo que habíamos comentado antes era la idea de que funciona como una división.»", "«En el palo que uno es perpendicular… uno es como que está recto y el otro está como chueco»", "«Si lo llegásemos a pensar algo más allá, yo creo que eso también podría significar algo, de acuerdo a las formas.»", "«Como que todas las diagonales van dirigidas al mismo punto de arriba.»", "«Sí, hay una dirección.»", "«Y también hay como dos, claramente como dos planos, ¿no?»", "«Ahora mismo estamos viendo muy claramente uno, pero hay uno que nos falla un montón.»", "«Como si … dos salas o dos habitaciones»", "«Hay como un montón de estructuras colocadas así y luego hay una así, la oblicua»", "«Las formas geométricas que generan los vacíos… ahí a la izquierda hay un triángulo, otro triángulo, arriba otro triángulo»", "«Incluso en separaciones mínimas que no sé ni siquiera si son a propósito o no, es como que tienen pequeñas formas»", "«Yo ahora estoy viendo como un barco, esto parece la proa, como tiene la forma así que se va abriendo»", "«Esto de T que es Cataluña, que un barco salga de el puerto de Discovery»", "«Es como que si le das un golpe todo se va a caer, me da como la sensación. Una sensación de inestabilidad.»", "«Yo me fijo mucho en la barra del medio… me intriga mucho, porque a todo le encuentro un cierto sentido, si no es estructural es más figurativo»", "«Los espirales que hay me recuerdan como a las típicas puertas, como más a las verjas»", "«Es como salir de Cataluña, ir por la puerta y coger el barco»", "«Es como te cuenta una historia de izquierda a derecha.»", "«Si fuera como algo más meteorológico, como de qué habría pasado como para que la estructura esté como tan como chueca»", "«Me da la sensación de que lo que hizo que esté de la forma en la que está ahora mismo es como el aire que la inclinó»", "«Las barras que salen de sus espirales me recuerdan mucho al instrumento del arpa, que és un element molt clàssic, molt tradicional.»", "«Podria ser una analogia d'alguna cosa.»"]}, {"title": "FASE 2 · CANVI DE PERSPECTIVA (ÀUDIO «MEJUNJE»)", "q": ["«Con las sombras y con el sol, eso parece como una escalera o que nos lleva a algún sitio.»", "«Sigue un poco la dirección para la derecha, entonces es como una escalera de un barco, una escalera hacia otro sitio, un futuro podría ser.»", "«Estoy como muy condicionada a la idea de antes»", "«Veo como una Cataluña a la puerta»", "«¡Ah! Una senyera.»", "«Pero le falta un palo. Hay cinco palos, pero entre ellas hay cuatro barras.»", "«Es como que nunca se acaba de formar una senyera perfectamente»", "«Es como si un niño pequeño intentase recrear de memoria»", "«Esta chapa de la derecha… Me funciona muy poco con la obra.»", "«Y desde aquí se ven mucho las torcidas.»", "«Es como que la obra todo el rato es un palito y todo está súper delicado y eso de la nada, boom»", "«También las sombras terminan de ser parte de la estructura»", "«Yo creo que sí que la completan de alguna forma»", "«Depende de a qué posición nos vayamos podríamos ver cosas diferentes»", "«¿Y hasta qué punto no te condiciona como la hora del día que vengas a verla?»", "«Puede ser un pentagrama… Y la clave de sol.»", "«Ahora con el cambio de perspectiva me da como menos sensación 3D.»", "«Veías la puerta y te imaginabas que era más profunda. Y ahora es como, bueno, es más plano»", "«Es como tu casa es 3D, pero como tú estás dentro no estás percibiendo ese 3D. Pero si la vieras como desde un exterior, sí ves que es 3D.»", "«Esas espirales… podrían representar al modernismo, que es un movimiento súper importante para la ciudad de Barcelona, y es un estilo muy marcado.»", "«Estem d'acord que això és una porta, més o menys… que això imita una miqueta els balcons del modernisme a Barcelona.»", "«Té molt sentit, no?, el Discovery Barcelona, o sigui, imitar-lo en una porta feta en part de Barcelona.»", "«Ens semblava un vaixell i ens ha condicionat… però potser ens està intentant mostrar diferents parts de Barcelona.»", "«Estem d'acord que les línies t'emputxen cap allà. La porta està com al mig de les línies.»", "«Tu tens la porta i un dinamisme que et convida a entrar per la porta. Les línies et diuen, has d'entrar per la porta.»", "«Més que sortir és com haver entrat ja.»", "«A lo mejor las líneas casi con ángulo recto son una representació de l'Eixample. I la Diagonal.»", "«També és com l'òxid, és així marró, taronja... Podria contrastar bastant amb la gespa i les plantes del fons.»", "«Podria ser que això fos la Diagonal. Sí, o la Meridiana.»", "«D'allà cap a les muntanyes, d'aquí cap a la ciutat, i això Diagonal, i això al mar»", "«L'òxid representa que és una estructura com antiga, que li ha passat el temps. I Barcelona és una ciutat molt antiga»", "«Amb tantes estructures metàl·liques, podria estar-nos parlant també una mica de les guerres, de la guerra civil»", "«La indústria… la Maquinista i totes les coses de construcció de hierro»", "«Això en forma de riu que podria ser el Llobregat, aquesta part més pensant en el Besòs»", "«El passeig de Gràcia… Rambla… vaixell per la Rambla, un riu a una banda i un riu a una altra»", "«El modernisme, que en part era crítica d'aquesta indústria… és com donar-li menys sentit a l'art, al detall.»", "«Està com la porta trencada amb detalls modernistes i està com fugint per la indústria»", "«¿Creéis que aquí hay una crítica? … ¿O también una historia? ¿A la burguesía?»", "«El modernisme i la burguesia són indissociables.»", "«També ho estem veient des d'una perspectiva que no s'ha contemplat… no des de la zona de pas on la gent pot seure»", "«Se puede ver desde atrás también.»"]}, {"title": "FASE 3 · ENTORN (ÀUDIO «MEJUNJE»)", "q": ["«Bueno, los colores, ¿no? El óxido es un poco naranja, como los edificios de ladrillo, que hay en todas partes, menos la facultad de traducción, que és blanca.»", "«Claramente también ha habido pájaros aquí.»", "«Acaba de pasar por ahí una urraca… hacen su uso de la puerta.»"]}]}}, "photos": {"1": [{"group": "Fotos per al 3D", "full": "fotos/e1_00.jpg", "thumb": "miniatures/e1_00.jpg", "name": "PXL_20261113_123144964.MP.jpg"}, {"group": "Fotos per al 3D", "full": "fotos/e1_01.jpg", "thumb": "miniatures/e1_01.jpg", "name": "PXL_20261113_123146062.jpg"}, {"group": "Fotos per al 3D", "full": "fotos/e1_02.jpg", "thumb": "miniatures/e1_02.jpg", "name": "PXL_20261113_123146592.jpg"}, {"group": "Fotos per al 3D", "full": "fotos/e1_03.jpg", "thumb": "miniatures/e1_03.jpg", "name": "PXL_20261113_123147259.jpg"}, {"group": "Fotos per al 3D", "full": "fotos/e1_04.jpg", "thumb": "miniatures/e1 const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cur='1',list=[],idx=0;
function render(){
 document.getElementById('tabs').innerHTML=['1','2'].map(k=>`<button class="${k===cur?'on':''}" data-k="${k}">Escultura ${k} · ${esc(D.text[k].name)}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;render()});
 list=D.photos[cur]; let h=`<h2>Model 3D</h2><a class="model" href="${D.model[cur]}" target="_blank">Obre el model 3D</a><h2>Fotos</h2>`, g=null;
 list.forEach((p,i)=>{ if(p.group!==g){ if(g!==null) h+='</div>'; g=p.group; h+=`<h3>${esc(g)}</h3><div class="grid">`; } h+=`<img loading="lazy" src="${p.thumb}" alt="${esc(p.name)}" data-i="${i}">`; });
 h+='</div><h2>Frases</h2>'; D.text[cur].phases.forEach(f=>{ h+=`<h3>${esc(f.title)}</h3><ul>`+f.q.map(q=>`<li>${esc(q)}</li>`).join('')+'</ul>'; });
 const m=document.getElementById('main'); m.innerHTML=h; m.querySelectorAll('.grid img').forEach(im=>im.onclick=()=>show(+im.dataset.i));
}
const lb=document.getElementById('lb');
function show(i){idx=(i+list.length)%list.length;document.getElementById('lbimg').src=list[idx].full;document.getElementById('lbcap').textContent=list[idx].name+'  ('+(idx+1)+'/'+list.length+')';lb.classList.add('on')}
document.getElementById('prev').onclick=e=>{e.stopPropagation();show(idx-1)};document.getElementById('next').onclick=e=>{e.stopPropagation();show(idx+1)};
lb.onclick=()=>lb.classList.remove('on');
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1)});
render();</script></body></html>
